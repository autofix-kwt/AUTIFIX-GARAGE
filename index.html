<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AUTOFIX Garage</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <img src="IMG_0160.png" class="logoImg" alt="AUTOFIX Garage">
    <div>
      <div class="name">AUTOFIX Garage</div>
      <div class="sub">حجز مواعيد أونلاين</div>
    </div>
  </div>
  <button id="langBtn">EN</button>
</header>

<section class="services">
  <h2>اختر الخدمة</h2>
  <div class="servicesGrid">
    <button data-svc="Diagnostics">🔧 فحص</button>
    <button data-svc="AC">❄️ تكييف</button>
    <button data-svc="Electrical">⚡ كهرباء</button>
    <button data-svc="Brakes">🛑 فرامل</button>
    <button data-svc="Maintenance">🛢️ صيانة</button>
    <button data-svc="Tires">🛞 إطارات</button>
    <button data-svc="Other" class="wide">🧰 أخرى</button>
  </div>
</section>

<main class="card">
<h1>حجز موعد</h1>
<p class="hint">مغلق الجمعة • استراحة ٢–٤ م • كل ٣٠ دقيقة</p>

<div class="grid">
  <input id="name" placeholder="الاسم">
  <input id="phone" placeholder="رقم الهاتف">

  <select id="service">
    <option>Diagnostics</option>
    <option>AC</option>
    <option>Electrical</option>
    <option>Brakes</option>
    <option>Maintenance</option>
    <option>Other</option>
  </select>

  <input type="date" id="date">
</div>

<div id="slots" class="slots"></div>

<textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea>

<button id="bookBtn">احجز عبر واتساب</button>
</main>

<footer>
  <a href="https://instagram.com/autofix.kwt" target="_blank">Instagram</a>
  <a href="https://tiktok.com/@autofix.kwt" target="_blank">TikTok</a>
  <a href="https://maps.app.goo.gl/WVvV9BRBxZCMdZdY7" target="_blank">📍 الموقع</a>
</footer>

</div>
