<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AUTOFIX Garage</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <img src="IMG_0160.png" class="logoImg" alt="AUTOFIX Garage">
    <div>
      <div class="name">AUTOFIX Garage</div>
      <div class="sub">حجز مواعيد أونلاين</div>
    </div>
  </div>
  <button id="langBtn">EN</button>
</header>

<!-- SERVICES -->
<section class="services">
  <h2>اختر الخدمة</h2>
  <div class="servicesGrid">
    <button data-svc="Diagnostics">🔧 فحص وتشخيص</button>
    <button data-svc="AC">❄️ تكييف</button>
    <button data-svc="Electrical">⚡ كهرباء</button>
    <button data-svc="Brakes">🛑 فرامل</button>
    <button data-svc="Maintenance">🛢️ صيانة</button>
    <button data-svc="Other" class="wide">🧰 أخرى</button>
  </div>
</section>

<main class="card">
<h1>حجز موعد</h1>
<p class="hint">مغلق الجمعة • استراحة ٢–٤ م • كل ٣٠ دقيقة</p>

<div class="grid">
  <input id="name" placeholder="الاسم">
  <input id="phone" placeholder="رقم الهاتف">

  <select id="service">
    <option>Diagnostics</option>
    <option>AC</option>
    <option>Electrical</option>
    <option>Brakes</option>
    <option>Maintenance</option>
    <option>Other</option>
  </select>

  <input type="date" id="date">
</div>

<div id="slots" class="slots"></div>

<textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea>

<button id="bookBtn" class="waBtn">
  <svg viewBox="0 0 32 32" class="waIcon">
    <path fill="#25D366" d="M16 3C9.4 3 4 8.1 4 14.4c0 2.5.8 4.8 2.2 6.7L4 29l8.2-2.1c1.2.3 2.4.5 3.8.5 6.6 0 12-5.1 12-11.4C28 8.1 22.6 3 16 3z"/>
    <path fill="#fff" d="M22.4 18.7c-.3-.1-1.8-.9-2.1-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1-1.2-.4-2.3-1.3c-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.5.1-.7.3s-1 1-1 2.4 1 2.8 1.1 3 .2.4.3.6c1.2 2 2.7 3.5 4.5 4.6 2.2 1.4 2.6 1.1 3.1 1.1.5 0 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/>
  </svg>
  احجز عبر واتساب
</button>
</main>

<footer class="footer">
  <a href="https://instagram.com/autofix.kwt" target="_blank" class="socialBtn">
    <!-- Instagram -->
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="17" cy="7" r="1.2" fill="currentColor"/>
    </svg>
    Instagram
  </a>

  <a href="https://tiktok.com/@autofix.kwt" target="_blank" class="socialBtn tiktok">
    <!-- TikTok multicolor -->
    <svg viewBox="0 0 64 64">
      <path fill="#25F4EE" d="M38 10v28c0 6.7-5.4 12.1-12.1 12.1S13.8 44.7 13.8 38s5.4-12.1 12.1-12.1c1 0 2 .1 3 .4v6.9c-1-.6-2-.9-3.4-.9-3.5 0-6.4 2.9-6.4 6.4s2.9 6.4 6.4 6.4 6.4-2.9 6.4-6.4V10h6z"/>
      <path fill="#FE2C55" d="M40.5 11.5v27.6c0 6.7-5.4 12.1-12.1 12.1-2.5 0-4.8-.7-6.8-2 2.1 2.9 5.5 4.8 9.3 4.8 6.7 0 12.1-5.4 12.1-12.1V14.6c3.2 2.6 6.9 4 11 4.2v-3.4c-5.7-.8-10.2-5.1-11.3-10.6h-2.2z"/>
      <path fill="currentColor" d="M38.9 10h3.8c1.1 5.5 5.6 9.8 11.3 10.6v3.4c-4.1-.2-7.8-1.6-11-4.2v27.3c0 6.7-5.4 12.1-12.1 12.1-3.8 0-7.2-1.9-9.3-4.8-1.2-1.7-1.9-3.8-1.9-6.1 0-5.9 4.8-10.7 10.7-10.7 1.4 0 2.7.3 3.9.8v-3.6c-1-.3-2-.4-3-.4-6.7 0-12.1 5.4-12.1 12.1 0 6.7 5.4 12.1 12.1 12.1s12.1-5.4 12.1-12.1V10z"/>
    </svg>
    TikTok
  </a>

  <a href="https://maps.app.goo.gl/WVvV9BRBxZCMdZdY7" target="_blank" class="socialBtn">
    📍 الموقع
  </a>
</footer>

</div>

<!-- FLOATING WHATSAPP -->

  <svg viewBox="0 0 32 32">
    <path fill="#25D366" d="M16 3C9.4 3 4 8.1 4 14.4c0 2.5.8 4.8 2.2 6.7L4 29l8.2-2.1c1.2.3 2.4.5 3.8.5 6.6 0 12-5.1 12-11.4C28 8.1 22.6 3 16 3z"/>

  </svg>
</a>

<script src="app.js"></script>
</body>
</html>
