<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AUTOFIX Garage | Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">

    <!-- HEADER -->
    <header class="top">
      <div class="brand">
        <img src="IMG_0160.png" class="logoImg" alt="AUTOFIX Garage">
        <div class="titles">
          <div class="name">AUTOFIX Garage</div>
          <div class="sub" id="subTitle">حجز مواعيد أونلاين</div>
        </div>
      </div>

      <button id="langBtn" class="langBtn" type="button">EN</button>
    </header>

    <!-- SERVICES -->
    <section class="services">
      <div class="servicesHead">
        <h2 id="svcHeader">اختر الخدمة</h2>
        <div class="mutedOnDark" id="svcSub">اضغط لاختيار الخدمة</div>
      </div>

      <div class="servicesGrid" id="servicesGrid">
        <button type="button" class="svc" data-svc="Diagnostics" data-ar="🔧 فحص وتشخيص" data-en="🔧 Diagnostics">🔧 فحص وتشخيص</button>
        <button type="button" class="svc" data-svc="AC"          data-ar="❄️ تكييف"      data-en="❄️ AC">❄️ تكييف</button>
        <button type="button" class="svc" data-svc="Electrical"  data-ar="⚡ كهرباء"     data-en="⚡ Electrical">⚡ كهرباء</button>
        <button type="button" class="svc" data-svc="Brakes"      data-ar="🛑 فرامل"     data-en="🛑 Brakes">🛑 فرامل</button>
        <button type="button" class="svc" data-svc="Maintenance" data-ar="🛢️ صيانة"     data-en="🛢️ Maintenance">🛢️ صيانة</button>
        <button type="button" class="svc wide" data-svc="Other"  data-ar="🧰 أخرى"      data-en="🧰 Other">🧰 أخرى</button>
      </div>
    </section>

    <!-- BOOKING CARD -->
    <main class="card">
      <h1 id="bookTitle">حجز موعد</h1>
      <p class="hint" id="hintText">مغلق الجمعة • استراحة ٢–٤ م • كل ٣٠ دقيقة • ٨:٣٠ص–٨:٠٠م</p>

      <section class="grid">
        <label class="field">
          <span id="lblName">الاسم</span>
          <input id="name" placeholder="اكتب اسمك" autocomplete="name" />
        </label>

        <div class="field">
          <span id="lblPhone">رقم الهاتف</span>
          <div class="phoneRow">
            <button class="countryBtn" type="button" id="countryBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="countryFlag">🇰🇼</span>
              <span id="countryCode">+965</span>
              <span class="chev">▾</span>
            </button>
            <input id="phone" placeholder="66601793" inputmode="numeric" autocomplete="tel-national" />
          </div>
          <div class="countryList" id="countryList" role="listbox" hidden></div>
          <div class="muted small" id="phoneHelp">اختر الدولة ثم اكتب الرقم بدون رمز الدولة.</div>
        </div>

        <label class="field">
          <span id="lblService">الخدمة</span>
          <select id="service">
            <option value="Diagnostics">Diagnostics</option>
            <option value="AC">AC</option>
            <option value="Electrical">Electrical</option>
            <option value="Brakes">Brakes</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label class="field">
          <span id="lblDate">التاريخ</span>
          <input id="date" type="date" />
        </label>
      </section>

      <section class="slotsWrap">
        <div id="slots" class="slots"></div>
        <div class="muted small" id="slotMsg"></div>
      </section>

      <label class="field">
        <span id="lblNotes">ملاحظات (اختياري)</span>
        <textarea id="notes" rows="3" placeholder="اكتب المشكلة أو المطلوب"></textarea>
      </label>

      <button id="bookBtn" class="waBtn" type="button">
        <span class="waIconBox" aria-hidden="true">
          <svg viewBox="0 0 32 32" class="waIcon">
            <path fill="#25D366" d="M16 3C9.4 3 4 8.1 4 14.4c0 2.5.8 4.8 2.2 6.7L4 29l8.2-2.1c1.2.3 2.4.5 3.8.5 6.6 0 12-5.1 12-11.4C28 8.1 22.6 3 16 3z"/>
            <path fill="#fff" d="M22.4 18.7c-.3-.1-1.8-.9-2.1-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1-1.2-.4-2.3-1.3c-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.5.1-.7.3s-1 1-1 2.4 1 2.8 1.1 3 .2.4.3.6c1.2 2 2.7 3.5 4.5 4.6 2.2 1.4 2.6 1.1 3.1 1.1.5 0 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/>
          </svg>
        </span>
        <span id="bookBtnText">احجز عبر واتساب</span>
      </button>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <a href="https://instagram.com/autofix.kwt" target="_blank" rel="noopener" class="socialBtn" aria-label="Instagram">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17" cy="7" r="1.2" fill="currentColor"/>
          </svg>
        </span>
        Instagram
      </a>

      <a href="https://tiktok.com/@autofix.kwt" target="_blank" rel="noopener" class="socialBtn tiktok" aria-label="TikTok">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path fill="#25F4EE" d="M38 10v28c0 6.7-5.4 12.1-12.1 12.1S13.8 44.7 13.8 38s5.4-12.1 12.1-12.1c1 0 2 .1 3 .4v6.9c-1-.6-2-.9-3.4-.9-3.5 0-6.4 2.9-6.4 6.4s2.9 6.4 6.4 6.4 6.4-2.9 6.4-6.4V10h6z"/>
            <path fill="#FE2C55" d="M40.5 11.5v27.6c0 6.7-5.4 12.1-12.1 12.1-2.5 0-4.8-.7-6.8-2 2.1 2.9 5.5 4.8 9.3 4.8 6.7 0 12.1-5.4 12.1-12.1V14.6c3.2 2.6 6.9 4 11 4.2v-3.4c-5.7-.8-10.2-5.1-11.3-10.6h-2.2z"/>
            <path fill="currentColor" d="M38.9 10h3.8c1.1 5.5 5.6 9.8 11.3 10.6v3.4c-4.1-.2-7.8-1.6-11-4.2v27.3c0 6.7-5.4 12.1-12.1 12.1-3.8 0-7.2-1.9-9.3-4.8-1.2-1.7-1.9-3.8-1.9-6.1 0-5.9 4.8-10.7 10.7-10.7 1.4 0 2.7.3 3.9.8v-3.6c-1-.3-2-.4-3-.4-6.7 0-12.1 5.4-12.1 12.1 0 6.7 5.4 12.1 12.1 12.1s12.1-5.4 12.1-12.1V10z"/>
          </svg>
        </span>
        TikTok
      </a>

      <a href="https://maps.app.goo.gl/WVvV9BRBxZCMdZdY7" target="_blank" rel="noopener" class="socialBtn" aria-label="Directions">
        <span class="icon" aria-hidden="true">📍</span>
        <span id="mapsText">الموقع</span>
      </a>
    </footer>

  </div>

  <!-- FLOATING WHATSAPP -->
  <a class="waFloat" id="waFloat" href="https://wa.me/96566601793" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" class="waFloatIcon" aria-hidden="true">
      <path fill="#25D366" d="M16 3C9.4 3 4 8.1 4 14.4c0 2.5.8 4.8 2.2 6.7L4 29l8.2-2.1c1.2.3 2.4.5 3.8.5 6.6 0 12-5.1 12-11.4C28 8.1 22.6 3 16 3z"/>
      <path fill="#fff" d="M22.4 18.7c-.3-.1-1.8-.9-2.1-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1-1.2-.4-2.3-1.3c-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.5.1-.7.3s-1 1-1 2.4 1 2.8 1.1 3 .2.4.3.6c1.2 2 2.7 3.5 4.5 4.6 2.2 1.4 2.6 1.1 3.1 1.1.5 0 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/>
    </svg>
  </a>

  <script src="app.js"></script>
</body>
</html>
